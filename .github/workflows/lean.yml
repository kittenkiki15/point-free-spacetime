name: Lean

on:
  push:
    branches: [main]
    paths: ["lean/**", ".github/workflows/lean.yml"]
  pull_request:
    paths: ["lean/**", ".github/workflows/lean.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Mathlib のキャッシュを使ってビルドする。
      # --wfail により、警告（`sorry` の使用を含む）があれば失敗させる。
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: "--wfail"
